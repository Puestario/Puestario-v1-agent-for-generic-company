name: Offline regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check shell syntax
        run: bash -n client/scripts/backup_local.sh
      - name: Placeholder count matches the tree
        run: python tests/ci_checks.py placeholders
      - name: core/rules has zero placeholders
        run: python tests/ci_checks.py core-rules
      - name: Session-load files fit their size budget
        run: python tests/ci_checks.py size-budget
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
